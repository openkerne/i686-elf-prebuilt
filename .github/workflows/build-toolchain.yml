name: Build Cross Toolchain

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-toolchain:
    runs-on: ubuntu-latest

    env:
      TARGET: i686-elf
      PREFIX: /opt/cross

      BINUTILS_VERSION: 2.45
      GCC_VERSION: 15.2.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            bison \
            flex \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            texinfo \
            wget

      - name: Download sources
        run: |
          wget https://ftp.gnu.org/gnu/binutils/binutils-${BINUTILS_VERSION}.tar.xz
          wget https://ftp.gnu.org/gnu/gcc/gcc-${GCC_VERSION}/gcc-${GCC_VERSION}.tar.xz

          tar xf binutils-${BINUTILS_VERSION}.tar.xz
          tar xf gcc-${GCC_VERSION}.tar.xz

      - name: Build Binutils
        run: |
          mkdir binutils-build
          cd binutils-build

          ../binutils-${BINUTILS_VERSION}/configure \
            --target=$TARGET \
            --prefix="$PREFIX" \
            --disable-nls \
            --disable-werror

          make -j$(nproc)
          make install DESTDIR=$PWD/install

      - name: Prepare GCC
        run: |
          cd gcc-${GCC_VERSION}
          ./contrib/download_prerequisites

      - name: Build GCC
        run: |
          mkdir gcc-build
          cd gcc-build

          ../gcc-${GCC_VERSION}/configure \
            --target=$TARGET \
            --prefix="$PREFIX" \
            --disable-nls \
            --enable-languages=c,c++,go \
            --without-headers

           make all-gcc -j$(nproc)
           make install-gcc DESTDIR=$PWD/install

      - name: Create toolchain package
        run: |
          mkdir -p release/toolchain

          cp -r binutils-build/install/opt/cross/* release/toolchain/
          cp -r gcc-build/install/opt/cross/* release/toolchain/

          tar -czvf \
            ${TARGET}-toolchain.tar.gz \
            -C release \
            toolchain

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET }}-toolchain
          path: ${{ env.TARGET }}-toolchain.tar.gz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.TARGET }}-toolchain.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
